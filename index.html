<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="google-site-verification"
content="-Ha6nZWVwrdk61soAS81GMmizlHuswJxMSonRKOctOc" />

<title>samvid</title>


<style>

/* ==============================
   PAGE
   ============================== */

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
}


/* ==============================
   MAIN CONTAINER
   ============================== */

.background {

    width: 100%;
    height: 100vh;
    height: 100svh;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    box-sizing: border-box;

    padding: 15px;

    gap: 20px;

    overflow: hidden;
}


/* ==============================
   LOGO
   ============================== */

.background img {

    width: min(65vw, 450px);

    height: auto;

    max-height: 55vh;

    border-radius: 50%;

    opacity: 0.5;

    object-fit: contain;

    display: block;

    flex-shrink: 1;
}


/* ==============================
   BUTTON
   ============================== */

.btn {

    width: 220px;

    height: 120px;

    border-radius: 7%;

    border: 2px solid #4caf50;

    background-color: lightgreen;

    text-align: center;

    padding: 6px;

    box-sizing: border-box;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-shrink: 0;

    animation: blinking 1s infinite;
}


/* ==============================
   BLINKING EFFECT
   ============================== */

@keyframes blinking {

    0% {
        background-color: lightgreen;
    }

    25% {
        background-color: yellow;
        color: lightgreen;
    }

    50% {
        background-color: red;
        color: lightgreen;
    }

    100% {
        background-color: lightgreen;
    }

}


/* ==============================
   LINK
   ============================== */

a:hover {

    background-color: navy;

    color: white;

}


a:link {

    display: inline-block;

    text-decoration: none;

}


/* ==============================
   MOBILE
   ============================== */

@media (max-width: 600px) {

    .background {

        gap: 15px;

        padding: 10px;

    }


    .background img {

        width: min(70vw, 300px);

        max-height: 48vh;

    }

}


/* ==============================
   SMALL MOBILE
   ============================== */

@media (max-width: 380px) {

    .background {

        gap: 10px;

        padding: 8px;

    }


    .background img {

        width: min(65vw, 240px);

        max-height: 42vh;

    }


    .btn {

        width: 200px;

        height: 110px;

    }

}


/* ==============================
   MOBILE LANDSCAPE
   ============================== */

@media (max-height: 500px) and (orientation: landscape) {

    .background {

        flex-direction: row;

        gap: 25px;

    }


    .background img {

        width: 45vh;

        max-height: 80vh;

    }


    .btn {

        width: 220px;

        height: 120px;

    }

}

</style>

</head>


<body
style="background-image:linear-gradient(90deg, #fc466b 0%, #3f5efb 100%);">


<div class="background">


    <!-- LOGO -->

    <img src="logo.png" alt="Logo">


    <!-- BUTTON -->

    <div class="btn">

        <a href="body.html" target="_parent">

            तमसो मा ज्योतिर्गमय<br>

            <i>(Lead me from darkness to light)</i>

        </a>

    </div>


</div>


</body>

</html>
