<!DOCTYPE html>
<html lang="sa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>वचनपरिवर्तनम्</title>

    <!-- Sanskrit/Devanagari Font -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Noto Sans Devanagari", sans-serif;
            background: linear-gradient(135deg, #eef2ff, #fdf2f8);
            min-height: 100vh;
            padding: 20px;
            color: #222;
        }

        .quiz-container {
            width: 100%;
            max-width: 720px;
            margin: auto;
            background: white;
            border-radius: 22px;
            padding: 25px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
        }

        .title {
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #4f46e5;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 15px;
            margin-bottom: 22px;
        }

        .progress-area {
            margin-bottom: 22px;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #555;
            margin-bottom: 7px;
        }

        .progress-bar {
            width: 100%;
            height: 9px;
            background: #e5e7eb;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 10%;
            background: #6366f1;
            border-radius: 20px;
            transition: width 0.3s ease;
        }

        .question-card {
            background: #f8fafc;
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 20px;
            border: 1px solid #e5e7eb;
        }

        .question-number {
            display: inline-block;
            background: #6366f1;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .question {
            font-size: 20px;
            line-height: 1.8;
            font-weight: 600;
            white-space: pre-line;
        }

        .options {
            margin-top: 20px;
        }

        .option {
            display: block;
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 12px;
            border: 2px solid #e5e7eb;
            background: white;
            border-radius: 13px;
            cursor: pointer;
            font-family: inherit;
            font-size: 17px;
            text-align: left;
            transition: 0.2s;
        }

        .option:hover {
            border-color: #6366f1;
            background: #f5f3ff;
        }

        .option.correct {
            background: #dcfce7;
            border-color: #22c55e;
            color: #166534;
        }

        .option.wrong {
            background: #fee2e2;
            border-color: #ef4444;
            color: #991b1b;
        }

        .option:disabled {
            cursor: not-allowed;
        }

        .feedback {
            text-align: center;
            font-size: 17px;
            font-weight: 600;
            margin: 15px 0;
            min-height: 25px;
        }

        .next-btn,
        .restart-btn {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 13px;
            background: #6366f1;
            color: white;
            font-family: inherit;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .next-btn:hover,
        .restart-btn:hover {
            background: #4f46e5;
        }

        .next-btn:disabled {
            background: #c7d2fe;
            cursor: not-allowed;
        }

        .result {
            display: none;
            text-align: center;
            padding: 25px 10px;
        }

        .result h2 {
            font-size: 30px;
            color: #4f46e5;
            margin-bottom: 15px;
        }

        .score {
            font-size: 42px;
            font-weight: 700;
            color: #16a34a;
            margin: 15px 0;
        }

        .message {
            font-size: 18px;
            margin-bottom: 25px;
            line-height: 1.7;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .quiz-container {
                padding: 18px;
                border-radius: 18px;
            }

            .title {
                font-size: 27px;
            }

            .question {
                font-size: 18px;
            }

            .option {
                font-size: 16px;
                padding: 13px;
            }
        }
    </style>
</head>

<body>

<div class="quiz-container">

    <h1 class="title">वचनपरिवर्तनम्</h1>
    <p class="subtitle">एकवचनात् बहुवचने परिवर्तनं कुरु</p>

    <div class="progress-area">
        <div class="progress-text">
            <span id="questionCounter">प्रश्नः 1 / 10</span>
            <span id="scoreText">अङ्काः: 0</span>
        </div>

        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>
    </div>

    <div id="quiz">

        <div class="question-card">

            <span class="question-number" id="questionNumber">
                प्रश्नः 1
            </span>

            <div class="question" id="question"></div>

            <div class="options" id="options"></div>

            <div class="feedback" id="feedback"></div>

            <button class="next-btn" id="nextBtn" disabled>
                Next →
            </button>

        </div>

    </div>

    <div class="result" id="result">

        <h2>🎉 उत्तमम्!</h2>

        <p>भवतः अन्तिम-अङ्कः</p>

        <div class="score" id="finalScore">
            0 / 10
        </div>

        <div class="message" id="resultMessage"></div>

        <button class="restart-btn" onclick="restartQuiz()">
            पुनः प्रयतन्ताम् ↻
        </button>

    </div>

</div>


<script>

const questions = [

    {
        question: `एकवचनम् - स बालकः ।\nबहुवचनम् - __________`,
        options: [
            "क) स बालकाः",
            "ख) तौ बालकः",
            "ग) ते बालकः",
            "घ) ते बालकाः"
        ],
        answer: 3
    },

    {
        question: `एकवचनम् - एषः शिक्षकः ।\nबहुवचनम् - __________`,
        options: [
            "क) एषः शिक्षकाः",
            "ख) एतौ शिक्षकः",
            "ग) एते शिक्षकाः",
            "घ) एषा शिक्षकः"
        ],
        answer: 2
    },

    {
        question: `एकवचनम् - अयं घटः ।\nबहुवचनम् - __________`,
        options: [
            "क) इयं घटः",
            "ख) इमे घटाः",
            "ग) इयं घटाः",
            "घ) इमौ घटाः"
        ],
        answer: 1
    },

    {
        question: `एकवचनम् - एतत् वस्त्रम् ।\nबहुवचनम् - __________`,
        options: [
            "क) एतानि वस्त्राणि",
            "ख) एता वस्त्राणि",
            "ग) एते वस्त्रम्",
            "घ) एतत् वस्त्राणि"
        ],
        answer: 0
    },

    {
        question: `एकवचनम् - एषा भाषा ।\nबहुवचनम् - __________`,
        options: [
            "क) एता भाषाः",
            "ख) एता भाषा",
            "ग) एभा साषा",
            "घ) एते बभाषे"
        ],
        answer: 0
    },

    {
        question: `एकवचनम् - इयं पुत्तलिका ।\nबहुवचनम् - __________`,
        options: [
            "क) इमाः पुत्तलिका",
            "ख) इमाः पुत्तलिकाः",
            "ग) एतानि पुत्तलिकानि",
            "घ) इमौ पुत्तलिकः"
        ],
        answer: 1
    },

    {
        question: `एकवचनम् - सा विद्या ।\nबहुवचनम् - __________`,
        options: [
            "क) ते विद्याः",
            "ख) ताः विद्या",
            "ग) अयं विद्या",
            "घ) ताः विद्याः"
        ],
        answer: 3
    },

    {
        question: `एकवचनम् - तत् द्वारम् ।\nबहुवचनम् - __________`,
        options: [
            "क) तानि द्वारम्",
            "ख) तानि द्वाराणि",
            "ग) ता द्वाराणि",
            "घ) ते द्वारम्"
        ],
        answer: 1
    },

    {
        question: `बहुवचने किं भवति?`,
        options: [
            `क) (एक) रजनी - (बहु) रजनीः,
(एक) देवी - (बहु) देवीः,
(एक) कौमुदी - (बहु) कौमुदीः,
(एक) धरणी - (बहु) धरणीः,
(एक) नदी - (बहु) नदीः`,

            `ख) (एक) रजनी - (बहु) रजन्य,
(एक) देवी - (बहु) देव्य,
(एक) कौमुदी - (बहु) कौमुद्य,
(एक) धरणी - (बहु) धरण्य,
(एक) नदी - (बहु) नद्य`,

            `ग) (एक) रजनी - (बहु) रजन्यः,
(एक) देवी - (बहु) देव्यः,
(एक) कौमुदी - (बहु) कौमुद्यः,
(एक) धरणी - (बहु) धरण्यः,
(एक) नदी - (बहु) नद्यः`,

            `घ) (एक) रजनी - (बहु) राजन्याः,
(एक) देवी - (बहु) देवाः,
(एक) कौमुदी - (बहु) कौमुदाः,
(एक) धरणी - (बहु) धारणाः,
(एक) नदी - (बहु) नदाः`
        ],
        answer: 2
    },

    {
        question: `"सम्मार्जन्यः" - एकवचने किं भवति?`,
        options: [
            "क) सम्मार्जनी",
            "ख) सम्मार्जनिः",
            "ग) समार्जनी",
            "घ) सम्मानानि"
        ],
        answer: 0
    }

];

let currentQuestion = 0;
let score = 0;
let answered = false;

const questionElement = document.getElementById("question");
const optionsElement = document.getElementById("options");
const feedbackElement = document.getElementById("feedback");
const nextBtn = document.getElementById("nextBtn");
const questionCounter = document.getElementById("questionCounter");
const questionNumber = document.getElementById("questionNumber");
const scoreText = document.getElementById("scoreText");
const progress = document.getElementById("progress");

function loadQuestion() {

    answered = false;

    const q = questions[currentQuestion];

    questionElement.textContent = q.question;

    questionCounter.textContent =
        `प्रश्नः ${currentQuestion + 1} / ${questions.length}`;

    questionNumber.textContent =
        `प्रश्नः ${currentQuestion + 1}`;

    scoreText.textContent =
        `अङ्काः: ${score}`;

    progress.style.width =
        ((currentQuestion + 1) / questions.length * 100) + "%";

    optionsElement.innerHTML = "";

    feedbackElement.textContent = "";

    nextBtn.disabled = true;

    q.options.forEach((option, index) => {

        const button = document.createElement("button");

        button.classList.add("option");

        button.textContent = option;

        button.onclick = () => selectAnswer(index, button);

        optionsElement.appendChild(button);

    });
}


function selectAnswer(selectedIndex, selectedButton) {

    if (answered) return;

    answered = true;

    const correctIndex = questions[currentQuestion].answer;

    const allOptions =
        document.querySelectorAll(".option");

    allOptions.forEach(button => {
        button.disabled = true;
    });

    if (selectedIndex === correctIndex) {

        score++;

        selectedButton.classList.add("correct");

        feedbackElement.textContent =
            "✓ साधु! उत्तरं सम्यक् अस्ति।";

        feedbackElement.style.color = "#16a34a";

    } else {

        selectedButton.classList.add("wrong");

        allOptions[correctIndex].classList.add("correct");

        feedbackElement.textContent =
            "✗ उत्तरम् अशुद्धम्।";

        feedbackElement.style.color = "#dc2626";
    }

    scoreText.textContent =
        `अङ्काः: ${score}`;

    nextBtn.disabled = false;
}


nextBtn.addEventListener("click", () => {

    currentQuestion++;

    if (currentQuestion < questions.length) {

        loadQuestion();

    } else {

        showResult();

    }

});


function showResult() {

    document.getElementById("quiz").style.display = "none";

    document.querySelector(".progress-area").style.display = "none";

    const result = document.getElementById("result");

    result.style.display = "block";

    document.getElementById("finalScore").textContent =
        `${score} / ${questions.length}`;

    let message = "";

    const percentage =
        (score / questions.length) * 100;

    if (percentage === 100) {

        message = " उत्तमम्! 🎉 ।";

    } else if (percentage >= 70) {

        message = "उत्तमम्! 👏 वचनपरिवर्तनस्य ज्ञानं  उत्तमम् अस्ति।";

    } else if (percentage >= 50) {

        message = "साधु! 👍 अधिकाभ्यासेन प्रयोजनम्।";

    } else {

        message = " 💪 पुनः पुनः अभ्यासेन प्रयोजनम्।";

    }

    document.getElementById("resultMessage").textContent =
        message;
}


function restartQuiz() {

    currentQuestion = 0;
    score = 0;

    document.getElementById("quiz").style.display = "block";

    document.querySelector(".progress-area").style.display = "block";

    document.getElementById("result").style.display = "none";

    loadQuestion();
}


loadQuestion();

</script>

</body>
</html>
