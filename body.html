<!DOCTYPE html>

<html lang="en">

<head>
 
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvV47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

<!-- Font Awesome -->
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer">

<!-- Existing stylesheet -->
<link rel="stylesheet" href="mystylesheet.css">

<title>Samvid</title>


<style>

    /* =====================================================
       BASIC RESET
    ===================================================== */

    * {
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        margin: 0;
        min-height: 100vh;

        display: flex;
        flex-direction: column;

        font-family: 'Poppins', sans-serif;

        background:
            radial-gradient(circle at top left, rgba(255,255,255,0.9), transparent 35%),
            linear-gradient(135deg, #eef4ff, #f8fbff);

        color: #222;
    }


    /* =====================================================
       NAVBAR
    ===================================================== */

    .navbar {
        width: 100%;
        padding: 12px 0;

        background: linear-gradient(135deg, #071d49, #0b3d91);

        box-shadow:
            0 5px 20px rgba(0, 0, 0, 0.18);

        position: relative;
        z-index: 100;
    }


    .nav-container {
        width: 100%;
        max-width: 1200px;

        margin: auto;
        padding: 0 20px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        gap: 20px;
    }


    /* =====================================================
       BRAND WITH PERSONAL LOGO
    ===================================================== */

    .brand {
        display: flex;
        align-items: center;

        gap: 10px;

        color: white;
        text-decoration: none;

        white-space: nowrap;
    }


    .brand-logo {
        width: 48px;
        height: 48px;

        object-fit: contain;

        border-radius: 10px;

        background: rgba(255,255,255,0.12);

        padding: 4px;

        transition:
            transform 0.3s ease,
            box-shadow 0.3s ease;
    }


    .brand:hover .brand-logo {
        transform: rotate(-4deg) scale(1.06);

        box-shadow:
            0 5px 15px rgba(255,255,255,0.25);
    }


    .brand-text {
        font-family: 'Playfair Display', serif;

        font-size: 1.65rem;
        font-weight: 700;

        letter-spacing: 1px;

        color: white;
    }


    /* =====================================================
       NAVIGATION
    ===================================================== */

    .nav-menu {
        display: flex;
        align-items: center;
        justify-content: center;

        list-style: none;

        padding: 0;
        margin: 0;

        gap: 7px;
    }


    .nav-menu li {
        list-style: none;
    }


    .nav-item-wrapper {
        position: relative;

        display: flex;
        flex-direction: column;
        align-items: center;
    }


    .nav-btn {
        position: relative;

        border: 1px solid transparent;

        background: transparent;

        color: white;

        min-height: 44px;

        padding: 9px 15px 6px;

        border-radius: 9px;

        font-family: 'Poppins', sans-serif;

        font-size: 0.82rem;
        font-weight: 600;

        letter-spacing: 0.7px;

        cursor: pointer;

        transition:
            background 0.25s ease,
            transform 0.25s ease;
    }


    .nav-btn:hover {
        background: rgba(255,255,255,0.13);

        transform: translateY(-2px);
    }


    .nav-btn:active {
        transform: scale(0.97);
    }


    /* =====================================================
       DECORATIVE UNDERLINE IMAGE
    ===================================================== */

    .nav-underline {
        width: 55px;
        height: 9px;

        margin-top: -1px;

        position: relative;
    }


    .nav-underline::before,
    .nav-underline::after {
        content: "";

        position: absolute;

        top: 4px;

        width: 21px;
        height: 2px;

        background: rgba(255,255,255,0.55);

        border-radius: 50%;
    }


    .nav-underline::before {
        left: 0;

        transform: rotate(3deg);
    }


    .nav-underline::after {
        right: 0;

        transform: rotate(-3deg);
    }


    .nav-underline span {
        position: absolute;

        left: 50%;
        top: 1px;

        transform: translateX(-50%);

        width: 8px;
        height: 8px;

        border: 2px solid rgba(255,255,255,0.75);

        border-radius: 50%;

        background: #0b3d91;
    }


    .nav-item-wrapper:hover .nav-underline::before,
    .nav-item-wrapper:hover .nav-underline::after {
        background: white;
    }


    .nav-item-wrapper:hover .nav-underline span {
        background: white;

        border-color: white;

        transform:
            translateX(-50%)
            scale(1.15);
    }


    /* =====================================================
       MAIN AREA
    ===================================================== */

    main {
        flex: 1;

        width: 100%;

        padding: 40px 15px 50px;
    }


    .content-card {
        width: 100%;
        max-width: 1000px;

        min-height: 380px;

        margin: 0 auto;
        padding: 45px;

        border-radius: 24px;

        background: rgba(255,255,255,0.94);

        border: 1px solid rgba(11,61,145,0.10);

        box-shadow:
            0 12px 40px rgba(0,0,0,0.10);

        display: flex;

        align-items: center;
        justify-content: center;

        transition:
            box-shadow 0.3s ease,
            transform 0.3s ease;
    }


    .content-card:hover {
        box-shadow:
            0 18px 50px rgba(0,0,0,0.14);

        transform: translateY(-2px);
    }


    /* =====================================================
       WELCOME AREA
    ===================================================== */

    .welcome-content {
        width: 100%;

        text-align: center;
    }


    .welcome-title {
        margin: 0 0 15px;

        font-family: 'Playfair Display', serif;

        color: #0b3d91;

        font-size: clamp(2.2rem, 5vw, 3.4rem);

        font-weight: 700;

        letter-spacing: 0.5px;
    }


    .welcome-message {
        margin: 0 0 25px;

        font-size: 1.05rem;

        color: #555;

        font-weight: 400;
    }


    .sanskrit-quote {
        display: inline-block;

        padding: 14px 28px;

        border-radius: 14px;

        background: #eef4ff;

        color: #0b3d91;

        font-size: clamp(1.15rem, 3vw, 1.45rem);

        font-weight: 600;

        border: 1px solid rgba(11,61,145,0.12);

        box-shadow:
            0 5px 18px rgba(11,61,145,0.07);
    }


    .translation {
        display: block;

        margin-top: 7px;

        font-family: 'Poppins', sans-serif;

        font-size: 0.9rem;

        font-style: italic;

        color: #666;
    }


    /* =====================================================
       DYNAMIC CONTENT
    ===================================================== */

    .dynamic-content {
        width: 100%;
    }


    .dynamic-title {
        margin-bottom: 25px;

        text-align: center;

        font-family: 'Playfair Display', serif;

        color: #0b3d91;

        font-size: 1.9rem;

        font-weight: 700;
    }


    .dynamic-content p {
        margin: 0;

        font-size: 1.08rem;

        line-height: 1.9;

        color: #333;

        text-align: justify;
    }


    /* =====================================================
       LINKS
    ===================================================== */

    .content-link {
        display: inline-flex;

        align-items: center;
        justify-content: center;

        min-height: 48px;

        padding: 12px 24px;

        border-radius: 10px;

        background: #0b3d91;

        color: white;

        text-decoration: none;

        font-weight: 600;

        transition:
            background 0.25s ease,
            transform 0.25s ease,
            box-shadow 0.25s ease;
    }


    .content-link:hover {
        color: white;

        background: #082f70;

        transform: translateY(-2px);

        box-shadow:
            0 8px 20px rgba(11,61,145,0.25);
    }


    /* =====================================================
       FOOTER
    ===================================================== */

    .footer {
        width: 100%;

        background:
            linear-gradient(135deg, #071d49, #092e68);

        color: #dbe7f7;

        text-align: center;

        padding: 25px 15px 18px;

        border-top: 3px solid #3d82d6;

        box-shadow:
            0 -5px 20px rgba(0,0,0,0.10);
    }


    .footer-inner {
        max-width: 1000px;

        margin: auto;
    }


    .footer-title {
        margin-bottom: 7px;

        font-family: 'Playfair Display', serif;

        color: white;

        font-size: 1.4rem;

        font-weight: 700;

        letter-spacing: 0.5px;
    }


    .footer-line {
        width: 70px;

        height: 2px;

        margin: 12px auto;

        background: rgba(255,255,255,0.35);
    }


    .footer-info {
        margin: 0;

        font-size: 0.88rem;

        line-height: 1.8;

        color: #bdcce1;
    }


    .footer-info strong {
        color: white;
    }


    .footer-email {
        color: white;

        text-decoration: none;

        font-weight: 600;
    }


    .footer-email:hover {
        color: #9bc7ff;

        text-decoration: underline;
    }


    .footer-copy {
        margin-top: 12px;

        font-size: 0.76rem;

        color: #91a5c1;
    }


    /* =====================================================
       TABLET
    ===================================================== */

    @media (max-width: 950px) {

        .nav-container {
            flex-direction: column;

            gap: 12px;
        }

        .nav-menu {
            flex-wrap: wrap;
        }

        .content-card {
            padding: 35px 28px;
        }

    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 600px) {

        .navbar {
            padding: 12px 8px;
        }


        .nav-container {
            padding: 0 8px;
        }


        .brand-logo {
            width: 42px;
            height: 42px;
        }


        .brand-text {
            font-size: 1.4rem;
        }


        .nav-menu {
            width: 100%;

            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 7px;
        }


        .nav-menu li {
            width: 100%;
        }


        .nav-item-wrapper {
            width: 100%;
        }


        .nav-btn {
            width: 100%;

            padding: 9px 4px 5px;

            font-size: 0.72rem;
        }


        .nav-underline {
            width: 50px;
        }


        main {
            padding: 20px 10px 30px;
        }


        .content-card {
            min-height: 380px;

            padding: 28px 18px;

            border-radius: 18px;
        }


        .welcome-title {
            font-size: 2rem;
        }


        .welcome-message {
            font-size: 0.95rem;
        }


        .sanskrit-quote {
            width: 100%;

            padding: 12px 10px;

            font-size: 1.05rem;
        }


        .dynamic-title {
            font-size: 1.5rem;
        }


        .dynamic-content p {
            font-size: 0.98rem;

            line-height: 1.75;
        }


        .content-link {
            width: 100%;

            padding: 12px 10px;

            font-size: 0.88rem;
        }


        .footer {
            padding: 23px 12px 17px;
        }


        .footer-title {
            font-size: 1.2rem;
        }


        .footer-info {
            font-size: 0.82rem;
        }

    }


    /* =====================================================
       VERY SMALL PHONES
    ===================================================== */

    @media (max-width: 360px) {

        .brand-text {
            font-size: 1.2rem;
        }


        .brand-logo {
            width: 38px;
            height: 38px;
        }


        .nav-btn {
            font-size: 0.68rem;
        }


        .content-card {
            padding: 24px 14px;
        }


        .welcome-title {
            font-size: 1.7rem;
        }

    }

</style>

</head>

<body>

<!-- =====================================================
     NAVBAR
===================================================== -->

</header>

    </section>

</main>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer class="footer">

    <div class="footer-inner">

        <div class="footer-title">

        </div>


        <div class="footer-line"></div>


        <p class="footer-info">

            Page designed and developed by
            <strong>M.K. Barman</strong>

            <br>

            <a href="mailto:infomkbin@gmail.com"

        <div class="footer-copy">

</footer>

    /* =====================================================

    ===================================================== */

                    <a href="#"
                       class="content-link">

                        <i class="fa-brands fa-instagram"></i>

    }

</script>

</body>
