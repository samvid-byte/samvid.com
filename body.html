<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Samvid - Sanskrit resources, projects, stories and learning">

    <title>Samvid</title>


    <!-- =====================================================
         GOOGLE FONTS
    ====================================================== -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
          rel="stylesheet">


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">


    <style>

        /* =====================================================
           RESET
        ====================================================== */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            flex-direction: column;

            font-family: "Poppins", sans-serif;

            color: #24344d;

            background:

                radial-gradient(
                    circle at 10% 10%,
                    rgba(255,255,255,0.95),
                    transparent 32%
                ),

                radial-gradient(
                    circle at 90% 90%,
                    rgba(195,220,255,0.55),
                    transparent 35%
                ),

                linear-gradient(
                    135deg,
                    #eef5ff,
                    #f8fbff,
                    #edf4ff
                );
        }


        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }


        /* =====================================================
           NAVBAR
        ====================================================== */

        .navbar {

            width: 100%;

            position: sticky;

            top: 0;

            z-index: 1000;

            background:

                linear-gradient(
                    135deg,
                    #03183d,
                    #06366f,
                    #0755a0
                );

            box-shadow:
                0 5px 25px rgba(0, 28, 72, 0.28);
        }


        .nav-container {

            width: 100%;

            max-width: 1250px;

            min-height: 78px;

            margin: auto;

            padding: 10px 22px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 25px;
        }


        /* =====================================================
           BRAND
        ====================================================== */

        .brand {

            display: flex;

            align-items: center;

            gap: 12px;

            text-decoration: none;

            color: white;

            flex-shrink: 0;
        }


        .brand-icon {

            width: 48px;

            height: 48px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family: "Libre Baskerville", serif;

            font-size: 1.35rem;

            font-weight: 700;

            color: #06366f;

            background: #ffffff;

            border: 2px solid rgba(255,255,255,0.8);

            box-shadow:
                0 4px 14px rgba(0,0,0,0.22);

            transition: 0.3s ease;
        }


        .brand:hover .brand-icon {

            transform: rotate(-5deg) scale(1.06);

        }


        .brand-text {

            font-family: "Playfair Display", serif;

            font-size: 1.85rem;

            font-weight: 700;

            letter-spacing: 1.5px;

            color: white;
        }


        /* =====================================================
           MOBILE MENU BUTTON
        ====================================================== */

        .menu-toggle {

            display: none;

            width: 44px;

            height: 44px;

            border: 1px solid rgba(255,255,255,0.25);

            border-radius: 10px;

            background: rgba(255,255,255,0.08);

            color: white;

            font-size: 1.25rem;

            cursor: pointer;

            transition: 0.25s ease;
        }


        .menu-toggle:hover {

            background: rgba(255,255,255,0.18);

        }


        .menu-toggle:active {

            transform: scale(0.94);

        }


        /* =====================================================
           NAVIGATION
        ====================================================== */

        .nav-menu {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 4px;

            margin: 0;

            padding: 0;

            list-style: none;
        }


        .nav-menu li {
            list-style: none;
        }


        .nav-item-wrapper {

            position: relative;

            display: flex;

            flex-direction: column;

            align-items: center;
        }


        .nav-btn {

            position: relative;

            min-height: 44px;

            padding: 9px 15px;

            border: 1px solid transparent;

            border-radius: 9px;

            background: transparent;

            color: #ffffff;

            font-family: "Poppins", sans-serif;

            font-size: 0.78rem;

            font-weight: 600;

            letter-spacing: 0.7px;

            cursor: pointer;

            transition:
                background 0.25s ease,
                transform 0.25s ease;
        }


        .nav-btn:hover {

            background: rgba(255,255,255,0.13);

            transform: translateY(-2px);

        }


        .nav-btn.active {

            background: rgba(255,255,255,0.17);

        }


        /* =====================================================
           NAV UNDERLINE
        ====================================================== */

        .nav-underline {

            position: absolute;

            bottom: -1px;

            left: 50%;

            transform: translateX(-50%);

            width: 55px;

            height: 7px;

            opacity: 0.8;

            transition: 0.25s ease;
        }


        .nav-underline::before,
        .nav-underline::after {

            content: "";

            position: absolute;

            top: 3px;

            width: 20px;

            height: 2px;

            border-radius: 100px;

            background: rgba(255,255,255,0.45);
        }


        .nav-underline::before {
            left: 0;
            transform: rotate(4deg);
        }


        .nav-underline::after {
            right: 0;
            transform: rotate(-4deg);
        }


        .nav-underline span {

            position: absolute;

            left: 50%;

            top: 0;

            width: 7px;

            height: 7px;

            transform: translateX(-50%);

            border-radius: 50%;

            background: #7fc8ff;

            border: 1px solid white;
        }


        .nav-item-wrapper:hover .nav-underline {

            opacity: 1;

        }


        .nav-item-wrapper:hover
        .nav-underline::before,
        .nav-item-wrapper:hover
        .nav-underline::after {

            background: white;

            width: 24px;
        }


        /* =====================================================
           MAIN
        ====================================================== */

        main {

            flex: 1;

            width: 100%;

            padding: 50px 18px 60px;

        }


        .content-card {

            width: 100%;

            max-width: 1080px;

            min-height: 430px;

            margin: auto;

            padding: 55px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 28px;

            background:

                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.98),
                    rgba(245,249,255,0.95)
                );

            border: 1px solid rgba(7,61,136,0.12);

            box-shadow:

                0 20px 55px
                rgba(18,52,98,0.13),

                inset 0 1px 0
                rgba(255,255,255,0.9);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }


        .content-card:hover {

            transform: translateY(-3px);

            box-shadow:

                0 25px 65px
                rgba(18,52,98,0.17);
        }


        /* =====================================================
           WELCOME
        ====================================================== */

        .welcome-content {

            width: 100%;

            max-width: 900px;

            margin: auto;

            text-align: center;
        }


        .welcome-title {

            margin: 0 0 16px;

            font-family: "Playfair Display", serif;

            font-size: clamp(
                2.2rem,
                6vw,
                3.8rem
            );

            font-weight: 700;

            line-height: 1.15;

            color: #063d85;

            letter-spacing: 0.2px;
        }


        .welcome-message {

            margin: 0 0 28px;

            font-size: 1.05rem;

            line-height: 1.8;

            color: #59697d;
        }


        /* =====================================================
           SANSKRIT QUOTE
        ====================================================== */

        .sanskrit-quote {

            display: inline-block;

            max-width: 100%;

            padding: 17px 30px;

            border-radius: 16px;

            font-family: "Libre Baskerville", serif;

            font-size: clamp(
                1.05rem,
                3vw,
                1.45rem
            );

            font-weight: 700;

            line-height: 1.7;

            color: #063d85;

            background:

                linear-gradient(
                    135deg,
                    #e5f0ff,
                    #f5f9ff
                );

            border: 1px solid rgba(7,61,136,0.13);

            box-shadow:
                0 8px 25px rgba(7,61,136,0.08);
        }


        .translation {

            display: block;

            margin-top: 5px;

            font-family: "Poppins", sans-serif;

            font-size: 0.82rem;

            font-weight: 400;

            font-style: italic;

            color: #6d7b8d;
        }


        /* =====================================================
           DYNAMIC CONTENT
        ====================================================== */

        .dynamic-content {

            width: 100%;

            max-width: 920px;

            margin: auto;
        }


        .dynamic-title {

            margin: 0 0 25px;

            text-align: center;

            font-family: "Playfair Display", serif;

            font-size: clamp(
                1.7rem,
                4vw,
                2.25rem
            );

            font-weight: 700;

            color: #063d85;
        }


        .dynamic-content p {

            margin: 0;

            font-size: 1.03rem;

            line-height: 1.95;

            text-align: justify;

            color: #354052;
        }


        /* =====================================================
           CONTENT BUTTON
        ====================================================== */

        .content-link {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-height: 50px;

            padding: 12px 26px;

            border-radius: 11px;

            background:

                linear-gradient(
                    135deg,
                    #0750a7,
                    #0872d5
                );

            color: white;

            text-decoration: none;

            font-size: 0.92rem;

            font-weight: 600;

            box-shadow:
                0 7px 20px rgba(7,80,167,0.22);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }


        .content-link:hover {

            color: white;

            transform: translateY(-3px);

            box-shadow:
                0 11px 28px rgba(7,80,167,0.30);
        }


        .content-link i {

            margin-left: 9px;

        }


        /* =====================================================
           SOCIAL BUTTONS
        ====================================================== */

        .social-buttons {

            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            gap: 14px;

            margin-top: 24px;
        }


        .social-btn {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 9px;

            min-width: 145px;

            min-height: 48px;

            padding: 10px 19px;

            border-radius: 11px;

            text-decoration: none;

            color: white;

            font-size: 0.9rem;

            font-weight: 600;

            background:

                linear-gradient(
                    135deg,
                    #0b4f9c,
                    #1976d2
                );

            box-shadow:
                0 6px 18px rgba(11,79,156,0.18);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }


        .social-btn:hover {

            color: white;

            transform: translateY(-3px);

            box-shadow:
                0 10px 25px rgba(11,79,156,0.28);
        }


        .social-btn i {

            font-size: 1.1rem;

        }


        /* =====================================================
           FOOTER
        ====================================================== */

        .footer {

            width: 100%;

            padding: 30px 15px 18px;

            text-align: center;

            color: #dbe8fa;

            background:

                linear-gradient(
                    135deg,
                    #03183d,
                    #06366f,
                    #073f7f
                );

            border-top: 3px solid #63b8ff;

            box-shadow:
                0 -8px 25px rgba(0,0,0,0.10);
        }


        .footer-inner {

            width: 100%;

            max-width: 1000px;

            margin: auto;
        }


        .footer-title {

            margin-bottom: 8px;

            font-family: "Playfair Display", serif;

            font-size: 1.45rem;

            font-weight: 700;

            color: white;
        }


        .footer-line {

            width: 75px;

            height: 2px;

            margin: 12px auto;

            background: rgba(255,255,255,0.35);
        }


        .footer-info {

            margin: 0;

            font-size: 0.88rem;

            line-height: 1.8;

            color: #bdcce1;
        }


        .footer-info strong {

            color: white;

        }


        .footer-email {

            color: white;

            text-decoration: none;

            font-weight: 600;

        }


        .footer-email:hover {

            color: #9dd1ff;

            text-decoration: underline;

        }


        .footer-copy {

            margin-top: 13px;

            font-size: 0.75rem;

            color: #91a9c8;
        }


        /* =====================================================
           TABLET
        ====================================================== */

        @media (max-width: 900px) {

            .nav-container {

                min-height: 70px;

                padding: 10px 18px;
            }


            .nav-btn {

                padding-left: 11px;

                padding-right: 11px;

                font-size: 0.73rem;
            }


            .content-card {

                padding: 45px 35px;

            }

        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 700px) {

            .navbar {

                position: sticky;

                top: 0;
            }


            .nav-container {

                min-height: 68px;

                padding: 9px 14px;

                flex-wrap: wrap;

            }


            .brand-icon {

                width: 43px;

                height: 43px;

                font-size: 1.15rem;
            }


            .brand-text {

                font-size: 1.55rem;

            }


            .menu-toggle {

                display: flex;

                align-items: center;

                justify-content: center;

            }


            nav {

                width: 100%;

                display: none;

            }


            nav.show {

                display: block;

            }


            .nav-menu {

                width: 100%;

                display: grid;

                grid-template-columns: repeat(2, 1fr);

                gap: 7px;

                padding: 8px 0 4px;

            }


            .nav-menu li {

                width: 100%;

            }


            .nav-item-wrapper {

                width: 100%;

            }


            .nav-btn {

                width: 100%;

                min-height: 46px;

                padding: 9px 5px;

                font-size: 0.70rem;

            }


            .nav-underline {

                bottom: 1px;

            }


            main {

                padding:

                    25px
                    10px
                    35px;
            }


            .content-card {

                min-height: 390px;

                padding:

                    35px
                    18px;

                border-radius: 20px;
            }


            .welcome-title {

                font-size: 2.15rem;

            }


            .welcome-message {

                font-size: 0.93rem;

                line-height: 1.75;

            }


            .sanskrit-quote {

                width: 100%;

                padding:

                    14px
                    10px;

                font-size: 1.03rem;

            }


            .translation {

                font-size: 0.76rem;

            }


            .dynamic-title {

                font-size: 1.65rem;

            }


            .dynamic-content p {

                font-size: 0.94rem;

                line-height: 1.85;

                text-align: left;

            }


            .content-link {

                width: 100%;

                max-width: 340px;

                min-height: 48px;

                padding: 12px 10px;

                font-size: 0.84rem;

            }


            .social-buttons {

                flex-direction: column;

                align-items: center;

            }


            .social-btn {

                width: 100%;

                max-width: 300px;

            }


            .footer {

                padding:

                    24px
                    12px
                    17px;
            }


            .footer-title {

                font-size: 1.25rem;

            }


            .footer-info {

                font-size: 0.81rem;

            }

        }


        /* =====================================================
           SMALL PHONES
        ====================================================== */

        @media (max-width: 380px) {

            .brand-icon {

                width: 39px;

                height: 39px;

                font-size: 1rem;

            }


            .brand-text {

                font-size: 1.35rem;

            }


            .menu-toggle {

                width: 40px;

                height: 40px;

            }


            .nav-menu {

                grid-template-columns: 1fr;

            }


            .nav-btn {

                font-size: 0.68rem;

            }


            .content-card {

                padding:

                    28px
                    13px;
            }


            .welcome-title {

                font-size: 1.8rem;

            }


            .sanskrit-quote {

                font-size: 0.94rem;

            }

        }


        /* =====================================================
           ACCESSIBILITY
        ====================================================== */

        .nav-btn:focus-visible,
        .menu-toggle:focus-visible,
        .content-link:focus-visible,
        .social-btn:focus-visible,
        .brand:focus-visible {

            outline: 3px solid #79c7ff;

            outline-offset: 3px;
        }


        /* =====================================================
           REDUCED MOTION
        ====================================================== */

        @media (prefers-reduced-motion: reduce) {

            html {

                scroll-behavior: auto;

            }

            *,
            *::before,
            *::after {

                transition: none !important;

            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     NAVBAR

<header class="navbar">

    <div class="nav-container">


        <!-- BRAND -->

        <a href="#"
           class="brand"
           onclick="hmbtn(); return false;">

            <div class="brand-icon"
                 aria-hidden="true">

         

            </div>

        <!-- MOBILE MENU BUTTON -->

        <button type="button"

        <!-- NAVIGATION -->

        <nav id="mainNav"

            <ul class="nav-menu">

                                class="nav-btn active"
                                onclick="hmbtn(); closeMenu();">

                        <div class="nav-underline">

                        </div>

                    </div>

                </li>


                <!-- ABOUT -->

                <li>

                    <div class="nav-item-wrapper">

                        <button type="button"
                                class="nav-btn"

                        </div>

                    </div>

                <!-- PROJECT -->

                <li>

                    <div class="nav-item-wrapper">

                        <div class="nav-underline">

                        </div>

        </nav>

    </div>

</header>



<!-- =====================================================
     MAIN CONTENT

<main>

    <section id="hm"
             class="content-card"
             aria-live="polite">


        <!-- HOME CONTENT -->

        <div class="welcome-content">

            <h1 class="welcome-title">

                Welcome to Samvid

        <p class="footer-info">

<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script>


    /* =====================================================
       MAIN VARIABLE
    ====================================================== */

    const x = "Welcome to Samvid";


    /* =====================================================
       ELEMENTS
    ====================================================== */

    const content = document.getElementById("hm");

    const mainNav = document.getElementById("mainNav");

    const menuToggle = document.getElementById("menuToggle");

    const navButtons =
        document.querySelectorAll(".nav-btn");


    /* =====================================================
       SET ACTIVE NAV BUTTON
    ====================================================== */

    function setActive(button) {

        navButtons.forEach(function(btn) {

            btn.classList.remove("active");

        });

        if (button) {

            button.classList.add("active");

        }

    }


    /* =====================================================
       HOME
    ====================================================== */

    function hmbtn(button = null) {

        content.innerHTML = `

            <div class="welcome-content">

                <h1 class="welcome-title">

                    ${x}

                </h1>

                <p class="welcome-message">

                    Explore Sanskrit resources, projects and stories.

                </p>

                <div class="sanskrit-quote">

                    तमसो मा ज्योतिर्गमय

                    <span class="translation">

                        Lead me from darkness to light

                    </span>

                </div>

            </div>

        `;

        setActive(button);

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    /* =====================================================
       ABOUT
    ====================================================== */

    function abts(button = null) {

        content.innerHTML = `

            <div class="dynamic-content">

                <h2 class="dynamic-title">

                    About Samvid

                </h2>

                <p>

                    The word Samvid means knowledge.

                    This webpage is designed for the development
                    and application of knowledge. Our intention
                    is to consider the practical aspects of
                    knowledge and its application.

                    Sanskrit is a very rich language.

                    The practical aspects of Sanskrit are
                    highlighted here for the dissemination
                    of knowledge, particularly considering
                    how the language can be applied in
                    technology and modern learning.

                </p>

            </div>

        `;

        setActive(button);

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    /* =====================================================
       PROJECT
    ====================================================== */

    function prjt(button = null) {

        content.innerHTML = `

            <div class="welcome-content">

                <h2 class="dynamic-title">

                    Projects

                </h2>

                <p class="welcome-message">

                    Explore the projects and practical
                    applications developed through Samvid.

                </p>

                <a href="multi.html"
                   class="content-link">

                    VIEW LIST OF THE PROJECTS

                    <i class="fa-solid fa-arrow-right"></i>

                </a>

            </div>

        `;

        setActive(button);

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }

    /* =====================================================
       MOBILE MENU
    ====================================================== */

    menuToggle.addEventListener("click", function() {

        const isOpen =
            mainNav.classList.toggle("show");

        menuToggle.setAttribute(
            "aria-expanded",
            isOpen
        );


        if (isOpen) {

            menuToggle.innerHTML =
                '<i class="fa-solid fa-xmark"></i>';

            menuToggle.setAttribute(
                "aria-label",
                "Close navigation menu"
            );

        } else {

            menuToggle.innerHTML =
                '<i class="fa-solid fa-bars"></i>';

            menuToggle.setAttribute(
                "aria-label",
                "Open navigation menu"
            );

        }

    });


    /* =====================================================
       CLOSE MOBILE MENU
    ====================================================== */

    function closeMenu() {

        if (window.innerWidth <= 700) {

            mainNav.classList.remove("show");

            menuToggle.setAttribute(
                "aria-expanded",
                "false"
            );

            menuToggle.innerHTML =
                '<i class="fa-solid fa-bars"></i>';

            menuToggle.setAttribute(
                "aria-label",
                "Open navigation menu"
            );

        }

    }


    /* =====================================================
       ADD ACTIVE STATE TO NAVIGATION
    ====================================================== */

    navButtons.forEach(function(button) {

        button.addEventListener("click", function() {

            setActive(button);

        });

    });


    /* =====================================================
       CLOSE MENU WHEN WINDOW BECOMES DESKTOP
    ====================================================== */

    window.addEventListener("resize", function() {

        if (window.innerWidth > 700) {

            mainNav.classList.remove("show");

            menuToggle.setAttribute(
                "aria-expanded",
                "false"
            );

            menuToggle.innerHTML =
                '<i class="fa-solid fa-bars"></i>';

        }

    });


</script>
